<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Serenity Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page signup-page">
  <div class="login-wrap">
    <div class="login-visual">
      <img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=1200&q=80" alt="Hotel pool and view">
      <div class="login-visual-overlay"></div>
      <div class="login-visual-text">
        <h1>Join Serenity</h1>
        <p>Create an account to book rooms and get member benefits.</p>
      </div>
    </div>
    <div class="login-form-wrap">
      <div class="login-form-inner">
        <a href="index.html" class="login-back">← Back to home</a>
        <h2>Create account</h2>
        <p class="login-sub">Fill in your details to get started.</p>
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label for="signup-name">Full name</label>
            <input type="text" id="signup-name" name="name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
        <p class="login-signup">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('signup-form');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var name = document.getElementById('signup-name').value.trim();
          var email = document.getElementById('signup-email').value.trim();
          var password = document.getElementById('signup-password').value;
          if (password.length < 6) {
            alert('Password must be at least 6 characters.');
            return;
          }
          localStorage.setItem('serenity_user', JSON.stringify({ name: name, email: email }));
          alert('Account created! Redirecting to home.');
          window.location.href = 'index.html';
        });
      }
    })();
  </script>
</body>
</html>
